databaseChangeLog:
  - command: --clear-checksums update
  - changeSet:
      id: setup_fdw
      author: Team
      changes:
        - sql:
            sql: |
              CREATE EXTENSION IF NOT EXISTS postgres_fdw;

              DROP SERVER IF EXISTS user_driver_server CASCADE;
              CREATE SERVER user_driver_server
              FOREIGN DATA WRAPPER postgres_fdw
              OPTIONS (host 'postgres-uds', dbname 'user_driver_db', port '5432');

              CREATE USER MAPPING FOR CURRENT_USER
              SERVER user_driver_server
              OPTIONS (user 'root', password 'root');

              CREATE SCHEMA IF NOT EXISTS user_driver_schema;

              IMPORT FOREIGN SCHEMA public
              FROM SERVER user_driver_server
              INTO user_driver_schema;
  - changeSet:
      id: create_driver_cache_table
      author: Team
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS driver_cache (
                id UUID NOT NULL,
                name VARCHAR(255) NOT NULL,
                orders_completed INTEGER,
                current_status VARCHAR(20),
                active BOOLEAN DEFAULT TRUE NOT NULL,
                CONSTRAINT driver_cache_pkey PRIMARY KEY (id)
              )

  - changeSet:
      id: 1
      author: Team
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
  - changeSet:
      id: 2
      author: Team
      changes:
        - sql:
            sql: |
              DROP TABLE IF EXISTS user_ride_history CASCADE;
              DROP TABLE IF EXISTS rides CASCADE;
              DROP TABLE IF EXISTS orders CASCADE;

  - changeSet:
      id: 3
      author: Team
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: payment_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: driver_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: pickup_address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
                    check: "status IN ('IN_PROGRESS', 'COMPLETED')"

  - changeSet:
      id: 4
      author: Team
      changes:
        - createTable:
            tableName: rides
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ride_order
                    references: orders(id)
              - column:
                  name: driver_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: pickup_address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: drop_address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: distance
                  type: numeric(10,2)
                  constraints:
                    nullable: false




  - changeSet:
      id: 5
      author: Team
      changes:
        - createTable:
            tableName: user_ride_history
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: ride_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_ride_history_ride
                    references: rides(id)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            constraints:
              primaryKey:
                columnNames: user_id, ride_id
                constraintName: pk_user_ride_history
        - createIndex:
            indexName: idx_user_ride_history_user_id
            tableName: user_ride_history
            columns:
              - column:
                  name: user_id

  - changeSet:
      id: 7
      author: Team
      changes:
        - sql:
            sql: ALTER TABLE orders ALTER COLUMN driver_id DROP NOT NULL

