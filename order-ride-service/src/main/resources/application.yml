server:
  port: 8082

# Настройки spring
spring:
  application:
    name: order-ride-service
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    clear-checksums: true
  datasource: # Подключение в БД
    url: jdbc:postgresql://localhost:5432/order_ride_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
kafka:
  bootstrap-servers: kafka:9092
  consumer:
    group-id: ${spring.application.name}-group
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  topics:
    driver-events: driver-events

  jpa: # Настройки hibernate
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# LOGGING
logging:
  level:
    root: info
    com.orderrideservice.*: debug
  file:
    path: logs/order-ride-service/
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7