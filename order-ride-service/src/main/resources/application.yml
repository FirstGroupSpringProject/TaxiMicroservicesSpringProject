server:
  port: 8082

spring:
  application:
    name: order-ride-service
  liquibase:
    enabled: false
  datasource:
    url: jdbc:postgresql://postgres-ors:5432/order_ride_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: order-ride-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderrideservice.event,com.yourcompany.commonevents.dto,java.util,java.lang"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topics:
      driver-events: driver-events
      ride-events: ride-events
      payment-requests: payment-requests
      payment-events: payment-events

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    root: info
    com.orderrideservice.*: debug
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: logs/order-ride-service/
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7