databaseChangeLog:
  - changeSet:
      id: 1
      author: Team
      changes:
        - dropTable:
            tableName: payments

  - changeSet:
      id: 2
      author: Team
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS invoices;

  - changeSet:
      id: 3
      author: Team
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  - changeSet:
      id: 4
      author: Team
      changes:
        - sql:
            sql: DROP TYPE IF EXISTS status_enum;

  - changeSet:
      id: 5
      author: Team
      changes:
        - sql:
            sql: CREATE TYPE status_enum AS ENUM ('PENDING', 'SUCCEEDED', 'FAILED');

  - changeSet:
      id: 6
      author: Team
      changes:
        - sql:
            sql: DROP TYPE IF EXISTS payment_method_enum;

  - changeSet:
      id: 7
      author: Team
      changes:
        - sql:
            sql: CREATE TYPE payment_method_enum AS ENUM ('CARD', 'CASH', 'MOBILE');

  - changeSet:
      id: 8
      author: Team
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: numeric(10, 3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: status_enum
                  constraints:
                    nullable: false

  - changeSet:
      id: 9
      author: Team
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: payment_method_enum
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: timestamp
                  constraints:
                    nullable: false

